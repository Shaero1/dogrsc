        - updatedAt
    ReportListItemDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reporterName:
          type: string
        reporterPhone:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
            - ACTIVE
            - HIDDEN
            - VERIFIED
        createdAt:
          type: string
        hasLocation:
          type: boolean
        verified:
