              $ref: '#/components/schemas/UpsertPageContentDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageContentAdminDto'
      security: *ref_19
      summary: Bulk upsert page translations
      tags: *ref_20
info:
  title: Dog Rescue API
  description: REST API for Dog Rescue (MVP scaffold)
  version: '1.0'
  contact: {}
tags: []
servers:
  - url: /
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    HealthResponseDto:
      type: object
      properties:
        status:
          type: string
          example: ok
          description: ok or degraded when DB unavailable
        database:
          type: string
          example: ok
          description: ok or error
        timestamp:
          type: string
          example: '2026-07-31T12:00:00.000Z'
        version:
          type: string
          example: 0.0.1
      required:
        - status
        - database
        - timestamp
        - version
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: admin@dogerescue.org
        password:
          type: string
      required:
        - email
        - password
    AuthUserDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          example: admin@dogerescue.org
        role:
          type: string
          enum:
            - ADMIN
            - STAFF
            - USER
          example: ADMIN
      required:
        - id
        - email
        - role
    LoginResponseDto:
      type: object
      properties:
        accessToken:
          type: string
        user:
          $ref: '#/components/schemas/AuthUserDto'
      required:
        - accessToken
        - user
    MediaResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        mimeType:
          type: string
          example: image/png
        sizeBytes:
          type: number
          example: 1024
        url:
          type: string
          description: Presigned GET URL (expires per MEDIA_PRESIGNED_TTL_SECONDS)
        createdAt:
          type: string
          example: '2026-08-02T00:00:00.000Z'
      required:
        - id
        - mimeType
        - sizeBytes
        - url
        - createdAt
    DogListItemDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        status:
          type: string
          enum:
            - AVAILABLE
            - ADOPTED
            - IN_CARE
            - ARCHIVED
        isPublished:
          type: boolean
        nameEn:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - slug
        - status
        - isPublished
        - updatedAt
    PaginatedDogsAdminResponseDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DogListItemDto'
        total:
          type: number
        page:
          type: number
        limit:
          type: number
      required:
        - items
        - total
        - page
        - limit
    DogLocaleContentRequiredDto:
      type: object
      properties:
        name:
          type: string
          example: Luna
        description:
          type: string
          example: Friendly mixed-breed looking for a calm home.
        rescueStory:
          type: string
      required:
        - name
        - description
    DogLocaleContentOptionalDto:
      type: object
      properties:
        name:
          type: string
          example: Luna
        description:
          type: string
        rescueStory:
          type: string
    DogDescriptionsDto:
      type: object
      properties:
        en:
          $ref: '#/components/schemas/DogLocaleContentRequiredDto'
        th:
          $ref: '#/components/schemas/DogLocaleContentOptionalDto'
        ru:
          $ref: '#/components/schemas/DogLocaleContentOptionalDto'
      required:
        - en
    CreateDogDto:
      type: object
      properties:
        descriptions:
          $ref: '#/components/schemas/DogDescriptionsDto'
        slug:
          type: string
          example: luna
        status:
          type: string
          enum:
            - AVAILABLE
            - ADOPTED
            - IN_CARE
            - ARCHIVED
          default: IN_CARE
        isPublished:
          type: boolean
          default: false
      required:
        - descriptions
    DogAdminResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        status:
          type: string
          enum:
            - AVAILABLE
            - ADOPTED
            - IN_CARE
            - ARCHIVED
        isPublished:
          type: boolean
        descriptions:
          type: object
        seo:
          type: object
        media:
          type: array
          items:
            $ref: '#/components/schemas/MediaResponseDto'
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - slug
        - status
        - isPublished
        - descriptions
        - seo
        - media
        - createdAt
        - updatedAt
    UpdateDogDto:
      type: object
      properties:
        descriptions:
          $ref: '#/components/schemas/DogDescriptionsDto'
        seo:
          type: object
        slug:
          type: string
        status:
          type: string
          enum:
            - AVAILABLE
            - ADOPTED
