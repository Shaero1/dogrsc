name: dogrsc-staging

services:
  postgres:
    image: postgres:15-alpine
    container_name: dogrsc-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dogrsc
      POSTGRES_PASSWORD: dogrsc
      POSTGRES_DB: dogrsc
    volumes:
      - dogrsc_staging_pg_data:/var/lib/postgresql/data
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dogrsc -d dogrsc']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dogrsc-staging-redis
    restart: unless-stopped
    volumes:
      - dogrsc_staging_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    container_name: dogrsc-staging-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dogrsc_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dogrsc_minio_secret}
    volumes:
      - dogrsc_staging_minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: dogrsc-staging-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dogrsc_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dogrsc_minio_secret}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/dogrsc-media
      "
    restart: 'no'

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: dogrsc-staging-backend
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      DATABASE_URL: postgresql://dogrsc:dogrsc@postgres:5432/dogrsc
      S3_ENDPOINT: http://minio:9000
      REDIS_URL: redis://redis:6379
    ports:
      - '4001:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4001/api/v1}
    container_name: dogrsc-staging-frontend
    restart: unless-stopped
    environment:
      API_URL: http://backend:4000/api/v1
    ports:
      - '3002:3000'
    depends_on:
      backend:
        condition: service_started

  admin:
    build:
      context: ..
      dockerfile: admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4001/api/v1}
    container_name: dogrsc-staging-admin
    restart: unless-stopped
    ports:
      - '3003:3000'
    depends_on:
      backend:
        condition: service_started

volumes:
  dogrsc_staging_pg_data:
  dogrsc_staging_redis_data:
  dogrsc_staging_minio_data:
