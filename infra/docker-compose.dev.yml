services:
  postgres:
    image: postgres:15-alpine
    container_name: dogrsc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dogrsc
      POSTGRES_PASSWORD: dogrsc
      POSTGRES_DB: dogrsc
    ports:
      - '5432:5432'
    volumes:
      - dogrsc_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dogrsc -d dogrsc']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dogrsc-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - dogrsc_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: dogrsc-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dogrsc_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dogrsc_minio_secret}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - dogrsc_minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: dogrsc-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dogrsc_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dogrsc_minio_secret}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/dogrsc-media
      "
    restart: 'no'

volumes:
  dogrsc_pg_data:
  dogrsc_redis_data:
  dogrsc_minio_data:
