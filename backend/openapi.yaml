        - reporterName
        - reporterPhone
        - description
        - createdAt
        - verified
        - media
    CreateReportDto:
      type: object
      properties:
        reporterName:
          type: string
          example: Somchai
        reporterPhone:
          type: string
          example: '+66812345678'
        reporterEmail:
          type: string
          example: reporter@example.com
        description:
          type: string
          example: Small brown dog near the market.
        latitude:
          type: number
          example: 13.7563
        longitude:
