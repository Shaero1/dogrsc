            - ARCHIVED
        name:
          type: string
        description:
          type: string
        rescueStory:
          type: string
        seoTitle:
          type: string
        seoDescription:
          type: string
        media:
          type: array
          items:
            $ref: '#/components/schemas/DogPublicMediaDto'
        locale:
