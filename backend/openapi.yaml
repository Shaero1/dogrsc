        currency:
          type: string
          example: THB
        status:
          type: string
          enum:
            - PENDING
            - CONFIRMED
            - FAILED
        paymentMethod:
          type: string
          enum:
            - BANK
            - CRYPTO
        donorName:
          type: string
          nullable: true
        donorEmail:
          type: string
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - amount
        - currency
        - status
        - createdAt
        - updatedAt
    CryptoAddressAdminDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        currencyCode:
          type: string
          example: BTC
        label:
          type: object
          example: Bitcoin
        address:
          type: string
        isActive:
          type: boolean
        isDisplayed:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
